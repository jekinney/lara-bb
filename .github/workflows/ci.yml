name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint

  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer analyse

  tests:
    name: Tests at 100% coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, pdo_mysql, mbstring, intl, gd
          coverage: xdebug
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - name: Pest with the 100% coverage gate
        run: php vendor/bin/pest --coverage --min=100

  docker:
    name: Image builds and boots
    runs-on: ubuntu-latest
    needs: [lint, analyse, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: larabb:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Fresh container answers /healthz before it is installed
        run: |
          docker run -d --name larabb -p 8080:80 -v larabb-storage:/app/storage \
            -e LARABB_INSTALLER_ALLOW_HTTP=true larabb:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && exit 0
            sleep 2
          done
          docker logs larabb
          exit 1
      - name: Web installer installs the board and locks itself
        run: scripts/smoke-install.sh larabb http://127.0.0.1:8080
      - name: Migrate role skips before install and runs after
        run: |
          docker run --rm -e CONTAINER_ROLE=migrate larabb:ci | grep -q "nothing to migrate"
          docker run --rm -e CONTAINER_ROLE=migrate -v larabb-storage:/app/storage larabb:ci | grep -q "Nothing to migrate"
      - name: Unknown role is rejected
        run: |
          set +e
          docker run --rm -e CONTAINER_ROLE=nope larabb:ci
          test $? -eq 64
